services:
  absensi-gateway:
    build: .
    environment:
      LISTEN_ADDR: ":8080"
      # host "postgres" adalah hostname container Postgres yang SUDAH
      # jalan di infra kamu (bukan bikin container baru) — bisa diakses
      # karena service ini digabungkan ke network yang sama (lihat bagian
      # `networks` di bawah).
      #
      # ${POSTGRES_USER}, ${POSTGRES_PASSWORD}, ${JWT_SECRET} diambil dari
      # file .env di folder yang sama (docker compose otomatis membacanya,
      # TIDAK perlu di-load manual). Isi file .env TIDAK boleh commit ke
      # git — sudah ada di .gitignore.
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/eduzone_absensi?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET}"
      TZ: "Asia/Jakarta"
    ports:
      - "8080:8080"
    networks:
      - network

networks:
  network:
    external: true
