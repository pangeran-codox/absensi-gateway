services:
  absensi-gateway:
    build: .
    restart: unless-stopped
    environment:
      LISTEN_ADDR: ":8080"
      # host "postgres" adalah hostname container Postgres yang SUDAH
      # jalan di infra kamu (bukan bikin container baru) — bisa diakses
      # karena service ini digabungkan ke network yang sama (lihat bagian
      # `networks` di bawah).
      #
      # ${POSTGRES_USER}, ${POSTGRES_PASSWORD}, ${JWT_SECRET} diambil dari
      # file .env di folder yang sama (docker compose otomatis membacanya,
      # TIDAK perlu di-load manual). Isi file .env TIDAK boleh commit ke
      # git — sudah ada di .gitignore.
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/eduzone_absensi?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET}"
      TZ: "Asia/Jakarta"
      # Default "false" kalau SYNC_ENABLED tidak di-set di .env — gateway
      # tetap jalan normal tanpa sinkronisasi (lihat docs/laravel-sync-contract.md).
      SYNC_ENABLED: "${SYNC_ENABLED:-false}"
      LARAVEL_SYNC_URL: "${LARAVEL_SYNC_URL:-}"
      LARAVEL_SYNC_TOKEN: "${LARAVEL_SYNC_TOKEN:-}"
      SYNC_INTERVAL: "${SYNC_INTERVAL:-5m}"
      AGGREGATION_ENABLED: "${AGGREGATION_ENABLED:-true}"
      AGGREGATION_INTERVAL: "${AGGREGATION_INTERVAL:-1m}"
      AGGREGATION_LOOKBACK_DAYS: "${AGGREGATION_LOOKBACK_DAYS:-2}"
      PHOTO_CACHE_DIR: "/data/photo-cache"
    ports:
      - "8080:8080"
    networks:
      - network
    volumes:
      # Named volume (dikelola Docker, BUKAN bind-mount ke folder host) —
      # supaya cache foto tidak hilang tiap container di-restart/rebuild.
      # Kalau volume ini dihapus manual, gateway tetap jalan normal (cuma
      # cache-nya kosong lagi, langsung fetch ulang dari Laravel).
      - photo-cache:/data/photo-cache

networks:
  network:
    external: true

volumes:
  photo-cache:
